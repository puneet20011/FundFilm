    <div class="container my-5">
  <h1 class="mb-4 text-center">Add Project Update</h1>

  <form id="updateForm" class="p-4 border rounded shadow-sm bg-light" enctype="multipart/form-data">
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input type="text" class="form-control" id="title" name="title" placeholder="Enter project title" required />
    </div>

    <div class="mb-3">
      <label for="gist" class="form-label">Gist</label>
      <input type="text" class="form-control" id="gist" name="gist" placeholder="Short one-line gist" required />
    </div>

    <div class="mb-3">
      <label for="summary" class="form-label">Summary</label>
      <textarea class="form-control" id="summary" name="summary" rows="4" placeholder="Write a short summary" required></textarea>
    </div>

  <div class="mb-3">
    <label for="image" class="form-label">Thumbnail (Upload)</label>
    <input type="file" class="form-control" id="image" name="image" accept="image/*"  />
  </div>

  <div class="mb-3">
    <label for="modal_image" class="form-label">Image (Upload)</label>
    <input type="file" class="form-control" id="modal_image" name="modal_image" accept="image/*" />
  </div>

    <button type="submit" class="btn btn-primary w-100">Submit Update</button>

    <p id="message" class="mt-3 text-center fw-bold"></p>
  </form>
</div>
